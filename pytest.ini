[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --import-mode=importlib
markers =
    tier1: Tier 1 Feature Isolation tests
    tier2: Tier 2 Boundary and Extreme Stress tests
    tier3: Tier 3 Pairwise Combinatorial Interaction tests
    tier4: Tier 4 Real-World Educational Lecture Workflow tests
    cuda: Tests requiring NVIDIA CUDA GPU acceleration
    slow: Tests requiring > 10 seconds execution time
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
